<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ねむりん">
<meta name="theme-color" content="#16142c">
<title>ねむりん</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root {
  --page: #2b2758; --win: #25224a; --cell: #34306a; --line: #f4efff; --edge: #120f26;
  --ink: #f4efff; --sub: #aba5dc; --gold: #ffd35c; --pink: #ff7aa2; --mint: #7ee0b5; --red: #ff5c7a;
}
body.night { --page: #16142c; }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  min-height: 100dvh; color: var(--ink); background: var(--page); transition: background .6s;
  font: 16px/1.5 "DotGothic16", "Hiragino Sans", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none;
}
img { image-rendering: pixelated; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
p { margin: 0; }
main {
  max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);
}
header { display: flex; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: .1em; color: var(--gold); text-shadow: 3px 3px 0 var(--edge); }

/* RPG-style window: white frame, dark outer line */
.win { background: var(--win); border: 3px solid var(--line); border-radius: 6px; box-shadow: 0 0 0 3px var(--edge), 0 6px 0 3px #0005; }
.mini { width: 36px; height: 36px; font-size: 18px; }

/* scene: 128px room, 64px sprites, one shared pixel scale */
.scene { position: relative; aspect-ratio: 1; overflow: hidden; padding: 0; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tag { position: absolute; top: 8px; left: 8px; z-index: 2; padding: 2px 10px; font-size: 14px; background: #120f26d9; border: 2px solid var(--line); border-radius: 4px; }
.tag.right { left: auto; right: 8px; }
.pet { position: absolute; left: 25%; width: 50%; bottom: 10%; }
.pet img { display: block; width: 100%; animation: bob 1.2s steps(1) infinite; }
.pet.s0 img { animation: wobble 3s steps(1) infinite; }
.pet img.hop { animation: hop .6s steps(1); }
.tired img { filter: grayscale(.7) brightness(.85); animation-duration: 2.4s; }
.shiny img, img.shiny { filter: hue-rotate(160deg) saturate(1.3); }
.tired.shiny img { filter: hue-rotate(160deg) grayscale(.7) brightness(.85); }
.pet.shiny::after { content: "✦"; position: absolute; top: 12%; right: 14%; color: var(--gold); font-size: 22px; animation: blink 1s steps(1) infinite; }
@keyframes bob { 50% { transform: translateY(-3.125%); } }
@keyframes wobble { 84% { transform: translateX(-3.125%); } 88% { transform: translateX(3.125%); } 92% { transform: translateX(-3.125%); } 96% { transform: translateX(3.125%); } 100% { transform: none; } }
@keyframes hop { 20% { transform: translateY(-9.4%); } 40% { transform: translateY(-12.5%); } 60% { transform: translateY(-6.25%); } 80% { transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
.bubble {
  position: absolute; top: 22%; left: 50%; transform: translateX(-50%); z-index: 3; white-space: nowrap;
  padding: 4px 12px; font-size: 14px; color: #2a2150; background: #fff; border: 3px solid var(--edge); border-radius: 4px;
}

/* status window */
.status { display: grid; gap: 8px; padding: 12px 14px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sub { font-size: 14px; color: var(--sub); }
.sub b { font-weight: 400; color: var(--ink); }
#stage { font-weight: 400; }
.hearts { display: flex; gap: 4px; }
.hearts svg { width: 21px; height: 18px; fill: #4a4580; shape-rendering: crispEdges; }
.hearts .on { fill: var(--pink); }
.bar { height: 14px; padding: 2px; background: var(--edge); border: 2px solid var(--sub); }
.bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--mint) 0 6px, #52b98f 6px 8px); transition: width .6s steps(8); }
#goal { font-size: 14px; color: var(--sub); }
.alert { font-size: 14px; color: var(--red); animation: blink 1.2s steps(1) infinite; }
.rare { font-style: normal; font-size: 13px; color: var(--gold); margin-left: 6px; }

/* commands */
.commands { display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 6px; gap: 6px; }
.commands button { padding: 12px 4px; border-radius: 4px; font-size: 16px; }
.commands button::before { content: "▶"; margin-right: 4px; color: var(--gold); visibility: hidden; }
.commands button:active { background: var(--cell); }
.commands button:active::before, .commands .main::before { visibility: visible; }
.commands .main { background: var(--cell); color: var(--gold); font-size: 18px; }
.commands .main::before { animation: blink 1s steps(1) infinite; }
.cmd { justify-self: center; padding: 8px 18px; color: var(--gold); background: var(--cell); border: 2px solid var(--line); border-radius: 4px; }
.install { font-size: 13px; color: var(--sub); text-align: center; }

/* sleeping */
.sleep {
  position: fixed; inset: 0; z-index: 10; padding: 24px; text-align: center; color: var(--sub);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0b0a1a;
}
.sleep::before { /* pixel stars */
  content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 3px; background: #fff; opacity: .8; animation: blink 3s steps(1) infinite;
  box-shadow: 40px 90px #fff, 120px 50px #fffa, 300px 70px #fff, 250px 160px #fff8, 60px 250px #fff9, 340px 300px #fff,
    180px 120px #fff7, 90px 420px #fff9, 320px 480px #fff, 30px 600px #fff8, 220px 640px #fff, 350px 700px #fff9, 150px 760px #fff7;
}
.timer { font-size: 44px; color: var(--ink); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.sleeper { position: relative; width: 256px; }
.sleeper img { display: block; width: 100%; animation: bob 2s steps(1) infinite; }
.sleeper span { position: absolute; top: 18%; right: 12%; font-size: 26px; color: var(--ink); opacity: 0; animation: zz 3.6s steps(6) infinite; }
.sleeper span:nth-of-type(2) { animation-delay: 1.2s; font-size: 20px; }
.sleeper span:nth-of-type(3) { animation-delay: 2.4s; font-size: 16px; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(36px, -72px); } }
.hint { font-size: 15px; line-height: 1.8; }

/* evolution */
.evo {
  position: fixed; inset: 0; z-index: 20; padding: 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #0b0a1a;
}
.evo img { width: 256px; }
.evo img.sil { filter: brightness(0) invert(1); }
.evo.done { animation: flash .6s steps(3); }
.evo p { font-size: 20px; line-height: 1.7; }
.evo .win { padding: 12px 16px; min-width: 260px; }
@keyframes flash { 0% { background: #fff; } }

/* dialogs */
dialog { width: min(92vw, 420px); max-height: 86dvh; padding: 16px; color: var(--ink); }
dialog::backdrop { background: #0b0a1acc; }
dialog form, #dlgBody { display: grid; gap: 12px; }
#dlgBody { text-align: center; }
dialog h2 { margin: 0; font-size: 20px; font-weight: 400; color: var(--gold); }
dialog h2 small { font-size: 14px; color: var(--sub); }
dialog h3 { margin: 4px 0 0; font-size: 14px; font-weight: 400; color: var(--sub); text-align: left; }
.big { width: 192px; aspect-ratio: 64 / 52; object-fit: cover; object-position: bottom; justify-self: center; } /* sprites use the lower 52px */
.gain { color: var(--mint); }
.warn { color: var(--red); }
.note { font-size: 13px; color: var(--sub); }
.help { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: 15px; text-align: left; }
.help b { font-weight: 400; color: var(--gold); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stats div, .history li, .dex button, .dex-info, .album figure { background: var(--cell); border-radius: 4px; }
.stats div { display: grid; padding: 6px 10px; text-align: left; }
.stats small { font-size: 12px; color: var(--sub); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 90px; }
.week div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
.week i { width: 60%; min-height: 3px; background: var(--mint); }
.week small { font-size: 11px; color: var(--sub); }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.history li { display: flex; justify-content: space-between; padding: 5px 10px; }
.album, .dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.album figure { margin: 0; padding: 4px; font-size: 13px; }
.album img, .dex img { width: 100%; aspect-ratio: 64 / 52; object-fit: cover; object-position: bottom; }
.dex button { position: relative; display: grid; justify-items: center; padding: 4px; font-size: 13px; }
.dex .unknown img { filter: brightness(0) opacity(.35); }
.dex em { position: absolute; top: 2px; font-style: normal; font-size: 12px; }
.dex .rare { left: 4px; margin: 0; }
.dex .shine { right: 4px; color: var(--gold); }
.dex-info { padding: 8px 12px; font-size: 14px; min-height: 64px; text-align: left; }
.close { justify-self: center; padding: 8px 28px; background: var(--cell); border: 2px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ねむりん</h1>
    <button id="helpBtn" class="win mini" aria-label="あそびかた">?</button>
  </header>

  <div class="win scene">
    <img id="bg" class="bg" alt="">
    <button id="name" class="tag" aria-label="なまえを かえる"></button>
    <span id="age" class="tag right"></span>
    <p id="bubble" class="bubble" hidden></p>
    <div id="petWrap" class="pet"><img id="pet" alt=""></div>
  </div>

  <section class="win status">
    <div class="row"><span id="stage"></span><span id="hearts" class="hearts" aria-label="げんき"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <p id="goal"></p>
    <p id="alert" class="alert" hidden></p>
    <div class="row sub"><span>きょう <b id="today"></b></span><span>れんぞく <b id="streak"></b></span></div>
    <button id="leaveBtn" class="cmd" hidden>▶ たびだたせる</button>
  </section>

  <nav class="win commands">
    <button id="sleepBtn" class="main">おやすみ</button>
    <button id="logBtn">きろく</button>
    <button id="dexBtn">ずかん</button>
  </nav>
  <p id="install" class="install" hidden>Safariの 共有ボタン →「ホーム画面に追加」で アプリとして遊べます</p>
</main>

<div id="sleepView" class="sleep" hidden>
  <p id="timer" class="timer">0:00:00</p>
  <div class="sleeper"><img id="sleepImg" alt=""><span>Z</span><span>z</span><span>z</span></div>
  <p id="sleepHint" class="hint"></p>
  <button id="wakeBtn" class="cmd">おこす</button>
</div>

<div id="evo" class="evo" hidden>
  <img id="evoImg" alt="">
  <p id="evoText" class="win"></p>
  <button id="evoOk" class="cmd" hidden>▶ OK</button>
</div>

<dialog id="dlg" class="win"><form method="dialog"><div id="dlgBody"></div><button class="close">とじる</button></form></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
